<script>
function areaRectangulo(base, altura) {
return base * altura;

}

function areaCirculo(radio) {
return Math.PI * radio ** 2;

}
let areaRect = areaRectangulo(10, 5)
let areaCirc = areaCirculo(3);

document.write("Area del Rectangulo: " + areaRect);
document.write("<br>")
document.write("Area del Circulo: " + areaCirc);



</script>
